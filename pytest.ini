[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra --strict-markers
xfail_strict = true
markers =
    private_data: needs the private drawing data/input/MIR_OT_ANTP_R22_K2_8.dxf, which is never committed; skipped (NOT RUN) when absent
    known_issue: confirmed calculation defect or open engineering rule; strict xfail until fixed with engineering approval
