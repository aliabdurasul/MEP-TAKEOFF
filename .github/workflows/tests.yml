name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Refuse committed CAD drawings
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(dxf|dwg)$'; then
            echo "::error::CAD drawings must not be committed to this repository"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Extract main's calculation modules for the equivalence tests
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          mkdir -p .baseline
          git show FETCH_HEAD:app.py > .baseline/app.py
          git show FETCH_HEAD:excel_export.py > .baseline/excel_export.py
          echo "MEP_BASELINE_DIR=.baseline" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          MEP_VALIDATION_REPORT: validation-report/${{ matrix.os }}.md
        run: python -m pytest

      - name: Publish validation report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/publish_validation_report.py validation-report/${{ matrix.os }}.md "${{ matrix.os }}"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report-${{ matrix.os }}
          path: validation-report/
          if-no-files-found: warn

  stale-upload-reproduction:
    name: stale-upload bug reproduces with app.py from main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the upload-flow test against main's app.py (must fail)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/legacy_app"
          git show FETCH_HEAD:app.py > "$RUNNER_TEMP/legacy_app/app.py"
          set +e
          env -u GITHUB_STEP_SUMMARY MEP_APP_DIR="$RUNNER_TEMP/legacy_app" \
            MEP_VALIDATION_REPORT="$RUNNER_TEMP/legacy-report/legacy.md" \
            python -m pytest tests/test_app_upload_flow.py -p no:cacheprovider
          status=$?
          set -e
          python .github/scripts/publish_validation_report.py "$RUNNER_TEMP/legacy-report/legacy.md" "main app.py (legacy)"
          if [ "$status" -eq 1 ]; then
            echo "main's app.py shows the previous drawing's total after a same-name re-upload (test failed as expected)."
          else
            echo "::error::Expected the upload-flow test to fail against main's app.py, got exit code $status"
            exit 1
          fi
